# ==============================================================================
# GZIP COMPRESSION CONFIGURATION (nginx/conf.d/compression.conf)
# ==============================================================================
# Optimizes payload delivery between VPS origin and Cloudflare edge proxies.
# ==============================================================================

gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    font/truetype
    font/opentype
    image/svg+xml;
