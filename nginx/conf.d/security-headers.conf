# ==============================================================================
# HTTP SECURITY HEADERS (nginx/conf.d/security-headers.conf)
# ==============================================================================
# Standard hardened security headers for production deployment.
# ==============================================================================

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking defense (disallow embedding in iframes from external domains)
add_header X-Frame-Options "SAMEORIGIN" always;

# Legacy browser XSS filter
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer transmission
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict sensitive browser APIs
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;

# Content Security Policy (Tailored for Next.js, Google Fonts, PWA, and Cloudflare)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https: wss:; media-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# ------------------------------------------------------------------------------
# HSTS (HTTP Strict Transport Security)
# NOTE: Only activate once SSL certificates are validated end-to-end behind Cloudflare.
# ------------------------------------------------------------------------------
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
