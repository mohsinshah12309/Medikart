# ==============================================================================
# RATE LIMITING ZONES (nginx/conf.d/rate-limiting.conf)
# ==============================================================================
# Defense-in-depth network rate limiting keyed by real visitor IP.
# Operates in tandem with backend Redis-backed sliding-window rate limiters.
# ==============================================================================

# General API rate limit (30 requests/second per IP with 10MB memory zone ~160,000 IPs)
limit_req_zone $binary_remote_addr zone=medikart_api:10m rate=30r/s;

# Strict Authentication & OTP rate limit (5 requests/second per IP)
limit_req_zone $binary_remote_addr zone=medikart_auth:10m rate=5r/s;

# Prescription Upload rate limit (10 requests/second per IP)
limit_req_zone $binary_remote_addr zone=medikart_upload:10m rate=10r/s;

# Standard HTTP 429 Too Many Requests response code on limit breach
limit_req_status 429;
