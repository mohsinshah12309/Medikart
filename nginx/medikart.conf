# ==============================================================================
# MEDIKART PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Domain: medikart.pk / www.medikart.pk / admin.medikart.pk
# Infrastructure: Next.js Storefront (:3000), Express Cluster (:5000), Vite Admin SPA (dist/)
# CDN & Edge: Cloudflare "Full (strict)" SSL + Cloudflare Real IP restoration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM BACKEND DEFINITIONS
# ------------------------------------------------------------------------------
# Express Backend cluster (Managed by PM2 cluster mode on port 5000)
# NOTE: PM2 cluster mode already load-balances incoming connections across all CPU
# cores internally using round-robin socket distribution. Nginx proxies to the single
# listening port 5000 without requiring double load-balancing.
upstream express_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Next.js Production Storefront (Managed by PM2 / next start on port 3000)
upstream nextjs_storefront {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. HTTP TO HTTPS GLOBAL REDIRECTS (PORT 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name medikart.pk www.medikart.pk admin.medikart.pk;

    # Let's Encrypt ACME challenge endpoint for automatic Certbot SSL renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all plain HTTP traffic permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 3. CANONICAL WWW TO NON-WWW REDIRECT (PORT 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.medikart.pk;

    # SSL Certificate Paths (Managed via Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/medikart.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medikart.pk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medikart.pk/chain.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Permanent 301 redirect to primary domain
    return 301 https://medikart.pk$request_uri;
}

# ------------------------------------------------------------------------------
# 4. PRIMARY STOREFRONT & API SERVER BLOCK (medikart.pk)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medikart.pk;

    # Max upload limit for medical prescriptions and catalog imagery (25MB)
    client_max_body_size 25M;

    # SSL Certificate Configuration (Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/medikart.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medikart.pk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medikart.pk/chain.pem;

    # Modern TLS Parameters & Session Caching
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Include modular snippets (Cloudflare Real IP, Security Headers, Gzip)
    include /etc/nginx/conf.d/cloudflare-real-ip.conf;
    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/compression.conf;

    # Access and Error Logs
    access_log /var/log/nginx/medikart_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/medikart_error.log warn;

    # --------------------------------------------------------------------------
    # 4A. BACKEND API ROUTING (/api/)
    # --------------------------------------------------------------------------
    location /api/ {
        # Network-level rate limiting for general API requests
        limit_req zone=medikart_api burst=40 nodelay;

        proxy_pass http://express_backend;
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Connection Upgrades (e.g. Chatbot streaming / events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Dynamic Content — Disable Nginx caching and buffering
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # 4B. STRICT RATE LIMITING FOR AUTH & OTP ENDPOINTS
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/(auth/(admin|customer)/|otp/) {
        limit_req zone=medikart_auth burst=10 nodelay;

        proxy_pass http://express_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4C. PRESCRIPTION UPLOADS & FILE UPLOADS ENDPOINTS
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/(orders/instant|prescriptions) {
        limit_req zone=medikart_upload burst=15 nodelay;
        client_max_body_size 25M;

        proxy_pass http://express_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 4D. STATIC UPLOADS SERVING (Product images, Banners, Placeholders)
    # --------------------------------------------------------------------------
    # Public media uploads served directly by Nginx with 30-day client cache
    location /uploads/ {
        alias /var/www/medikart/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # CRITICAL SECURITY RULE: Block direct public access to prescription uploads.
    # Prescriptions contain sensitive patient medical data and are ONLY accessible
    # through the authenticated backend API: GET /api/v1/admin/prescriptions/:filename
    location /uploads/prescriptions/ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 4E. NEXT.JS STATIC CHUNKS & ASSET OPTIMIZATION
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Immutable 1-year caching for fingerprinted Next.js static files
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4F. NEXT.JS STOREFRONT APPLICATION (ROOT REVERSE PROXY)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts & Buffering
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # 4G. OPTIONAL: PATH-BASED ADMIN PANEL (if not using admin.medikart.pk)
    # --------------------------------------------------------------------------
    # Uncomment the following block ONLY if you prefer medikart.pk/admin over admin.medikart.pk:
    # location /admin {
    #     alias /var/www/medikart/apps/admin/dist;
    #     index index.html;
    #     try_files $uri $uri/ /admin/index.html;
    # }
}

# ------------------------------------------------------------------------------
# 5. DEDICATED ADMIN DASHBOARD SERVER BLOCK (admin.medikart.pk)
# ------------------------------------------------------------------------------
# Serves the compiled React/Vite SPA directly as high-performance static files.
# No Node process is required for apps/admin.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.medikart.pk;

    # Path to compiled Vite production output
    root /var/www/medikart/apps/admin/dist;
    index index.html;

    # SSL Certificate Configuration (Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/medikart.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medikart.pk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medikart.pk/chain.pem;

    # Modern TLS Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Include modular snippets
    include /etc/nginx/conf.d/cloudflare-real-ip.conf;
    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/compression.conf;

    access_log /var/log/nginx/medikart_admin_access.log combined;
    error_log /var/log/nginx/medikart_admin_error.log warn;

    # --------------------------------------------------------------------------
    # OPTIONAL ADMIN IP ALLOWLISTING (Commented Placeholder)
    # Uncomment and replace with authorized office/VPN IPs to restrict dashboard access:
    # --------------------------------------------------------------------------
    # allow 103.255.4.12;       # Office Static IP
    # allow 182.180.12.34;      # VPN IP Range
    # deny all;

    # --------------------------------------------------------------------------
    # ADMIN API PROXY ROUTE
    # --------------------------------------------------------------------------
    # Proxies authenticated requests from admin dashboard to Express backend
    location /api/ {
        limit_req zone=medikart_api burst=50 nodelay;

        proxy_pass http://express_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    # Proxy /uploads/ for admin image previews
    location /uploads/ {
        alias /var/www/medikart/server/uploads/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Block public prescription directory browsing even on admin domain
    location /uploads/prescriptions/ {
        deny all;
        return 404;
    }

    # Static Vite Assets with caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # React Single Page Application (SPA) Fallback Route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
