      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <filter id="painShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#991B1B" flood-opacity="0.2"/>
