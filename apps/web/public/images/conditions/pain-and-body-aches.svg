      <rect x="72" y="130" width="21" height="12" rx="2" fill="#FFFFFF"/>
      <path d="M72 65 L82 85 H74 L84 105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Fast Acting Analgesic Pain Capsule -->
