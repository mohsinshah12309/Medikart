# ==============================================================================
# Medikart Enterprise Production Nginx Configuration
# High-Performance Reverse Proxy with Load Balancing, HTTP/2, & Cloudflare CDN
# ==============================================================================

# 1. Upstream Load-Balanced Clusters with Persistent Keepalive
upstream medikart_web_upstream {
    least_conn; # Distribute to least busy process
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream medikart_api_upstream {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 2. Main Storefront & API Server (medikart.pk & www.medikart.pk)
server {
    listen 80;
    listen [::]:80;
    server_name medikart.pk www.medikart.pk;

    # Cloudflare Real IP Restoration (Trust Cloudflare Edge IP Ranges)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Maximum file upload size for doctor prescriptions & product catalog
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Fast Gzip Compression for text payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Next.js Static Chunks & Assets (Immutable Edge Caching)
    location /_next/static/ {
        proxy_pass http://medikart_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Images, Fonts, Favicons, Manifest
    location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://medikart_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
    }

    # Product Uploads & Prescription Media
    location /uploads/ {
        proxy_pass http://medikart_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Backend API Endpoints (/api/)
    location /api/ {
        proxy_pass http://medikart_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Next.js Web Storefront (SSR Pages & Edge Cache Fallback)
    location / {
        proxy_pass http://medikart_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

# 3. Admin Panel (admin.medikart.pk)
server {
    listen 80;
    listen [::]:80;
    server_name admin.medikart.pk;

    root /var/www/medikart/apps/admin/dist;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
